[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paris"
version = "1.0.0"
description = "A disciplined sports-betting decision-support system (Systeme Maitre) — match analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
app = [
    "streamlit>=1.37",
    "pandas>=2.0",
    "plotly>=5.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]
postgres = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.scripts]
paris = "paris.cli:main"

[tool.setuptools.packages.find]
include = ["paris*"]

[tool.setuptools.package-data]
paris = ["storage/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
